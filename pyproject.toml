[project]
name = "daily-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "httpx",
    "cryptography>=50.0.2",
]

[dependency-groups]
auth = [
    "google-auth-oauthlib>=1.5.0",
]
dev = ["pytest", "ruff", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# the browser script and the agent's prompt are text, wrapping them hurts more than it helps
"app/agent/driver.py" = ["E501"]
"app/agent/llm.py" = ["E501"]
